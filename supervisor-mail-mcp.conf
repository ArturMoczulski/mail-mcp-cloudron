[program:mail-mcp]
command=/app/code/venv/bin/mcp-email-server streamable-http --host 127.0.0.1 --port 9557
directory=/app/data
user=cloudron
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=HOME="/app/data",MCP_EMAIL_SERVER_CONFIG_PATH="/app/data/config.toml"
